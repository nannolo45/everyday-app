<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Everyday</title>
  <meta name="theme-color" content="#2f6b6f">
  <script>/* (v62) the theme before the first paint: the choice saved on this device, else the device's own */(function(){var c='auto';try{c=localStorage.getItem('everyday-theme')||'auto'}catch(e){}var d=c==='dark'||(c!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.className=d?'dark':'light';})()</script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Everyday">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/shoplist.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1 id="app-title">Everyday</h1>
    <button id="sync" class="sync local" type="button"><span class="dot"></span><span id="sync-label"></span></button>
    <a id="gear" class="gear" href="#/settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.27 4.80 L10.72 2.49 L13.28 2.49 L13.73 4.80 L15.87 5.69 L17.82 4.37 L19.63 6.18 L18.31 8.13 L19.20 10.27 L21.51 10.72 L21.51 13.28 L19.20 13.73 L18.31 15.87 L19.63 17.82 L17.82 19.63 L15.87 18.31 L13.73 19.20 L13.28 21.51 L10.72 21.51 L10.27 19.20 L8.13 18.31 L6.18 19.63 L4.37 17.82 L5.69 15.87 L4.80 13.73 L2.49 13.28 L2.49 10.72 L4.80 10.27 L5.69 8.13 L4.37 6.18 L6.18 4.37 L8.13 5.69 Z"/><circle cx="12" cy="12" r="3.1"/></svg><span class="gear-label" id="gear-label"></span></a>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <a href="#/today" data-tab="today"><span class="ico" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.8l3 1.8"/></svg></span><span class="label"></span></a>
    <a href="#/events" data-tab="events"><span class="ico" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9.2 15.5 2 2 3.8-4"/></svg></span><span class="label"></span></a>
    <a href="#/tasks" data-tab="tasks"><span class="ico" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="m4 6.5 1.8 1.8L9 5M4 12.5l1.8 1.8L9 11M4 18.5l1.8 1.8L9 17M12.5 7h7.5M12.5 13h7.5M12.5 19h7.5"/></svg><span class="count" id="shop-count" hidden></span></span><span class="label"></span></a>
    <a href="#/plan" data-tab="plan"><span class="ico" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M7.5 14h4M7.5 17h7"/></svg><span class="count plan-count" id="plan-count" hidden></span></span><span class="label"></span></a>
  </nav>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <button id="fab" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
